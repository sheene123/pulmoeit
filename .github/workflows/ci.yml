name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PULMOEIT_NO_MLFLOW: "1"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit & API tests
        run: pytest

  pipeline-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[train]"
      - name: Run the pipeline on a tiny configuration
        run: |
          P=configs/params.smoke.yaml
          pulmoeit --params $P generate
          pulmoeit --params $P baseline
          pulmoeit --params $P train
          pulmoeit --params $P evaluate
          pulmoeit --params $P export
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-model
          path: |
            models/pulmoeit.onnx
            models/qc.npz
            models/model_card.json
            reports/

  docker:
    needs: pipeline-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-model
          path: .
      - name: Build serving image
        run: docker build -t pulmoeit:${{ github.sha }} .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 pulmoeit:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api
          exit 1
