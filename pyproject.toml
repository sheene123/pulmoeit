[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pulmoeit"
version = "0.2.0"
description = "Imagerie pulmonaire EIT sur de vrais enregistrements : méthodes de reconstruction comparées et mesures cliniques"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
reel = ["onnxruntime>=1.18"]  # préparation des vraies données (scripts/preparer_reel.py, réseau figé en ONNX)
dev = ["pytest>=8", "ruff>=0.5"]
deploy = ["huggingface_hub>=0.23"]  # publication de la démo web (scripts/deployer_space.py)

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E741", "E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
