[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pulmoeit"
version = "0.1.0"
description = "Reconstruction EIT pulmonaire par apprentissage profond et chaîne MLOps pour appareils portables"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
sim = ["scipy>=1.11", "matplotlib>=3.8"]
train = ["pulmoeit[sim]", "torch>=2.5", "onnx>=1.16", "onnxscript>=0.2", "onnxruntime>=1.18", "mlflow>=2.14", "dvc>=3.50"]
serve = ["onnxruntime>=1.18", "fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pulmoeit[train,serve]", "pytest>=8", "httpx>=0.27", "ruff>=0.5"]
deploy = ["huggingface_hub>=0.23"]  # publication de la démo web (scripts/deployer_space.py)

[project.scripts]
pulmoeit = "pulmoeit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E741", "E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
